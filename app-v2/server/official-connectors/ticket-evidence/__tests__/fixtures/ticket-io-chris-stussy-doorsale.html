<!DOCTYPE html>
<html>
  <head><title>Chris Stussy</title></head>
  <body>
    <table class="table config">
      <tbody>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">Doorsale</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">45,00 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="45" data-tickettypename="Doorsale">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">Locker - Size: M</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">4,00 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="4" data-tickettypename="Locker - Size: M">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">Premium Ticket</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">63,99 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="63.99" data-tickettypename="Premium Ticket">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
