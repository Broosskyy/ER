<!DOCTYPE html>
<html>
  <head><title>NYE 2026</title></head>
  <body>
    <table class="table config">
      <tbody>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">Blind Ticket</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">29,90 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="29.9" data-tickettypename="Blind Ticket">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">Locker - Size: M</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">8,00 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="8" data-tickettypename="Locker - Size: M">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
        <tr class="ticketTypes">
          <td><strong class="ticketType-title">VIP Ticket</strong></td>
          <td class="ticketSinglePrice"><span class="ticket-price-value">70,00 Euro</span></td>
          <td class="td-count">
            <select class="ticketCount form-control" data-price="70" data-tickettypename="VIP Ticket">
              <option value="0">0</option>
              <option value="1">1</option>
            </select>
          </td>
        </tr>
      </tbody>
    </table>
  </body>
</html>
