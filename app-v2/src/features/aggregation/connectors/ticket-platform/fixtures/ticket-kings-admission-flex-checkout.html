<!doctype html>
<html lang="de">
<body>
  <div class="ticket-card ticket-section-card ticket-selection-card" id="ticket-selection">
    <h2 class="title is-5">Tickets</h2>
    <div class="box ticket-type-box ticket-option-choice">
      <div class="ticket-option-choice-inner">
        <div class="control ticket-option-main">
          <div class="ticket-option-title">Standard Ticket</div>
          <div class="ticket-meta ticket-option-meta">
            <span>Phase 3</span>
            <span><strong>15,00 EUR</strong>&nbsp;pro Ticket</span>
            <span>noch 114 verfügbar</span>
          </div>
        </div>
        <div class="control ticket-option-qty">
          <div class="qty-stepper" data-qty-stepper></div>
        </div>
      </div>
    </div>
  </div>
  <div class="ticket-card ticket-section-card ticket-addons-card">
    <span class="ticket-step-label">Optional</span>
    <h2 class="title is-5">Zusatzoptionen</h2>
    <div class="box ticket-type-box ticket-addon-choice">
      <div class="ticket-addon-choice-inner">
        <input type="checkbox" name="addons[1]" data-addon-input />
        <label class="ticket-addon-title">Ticket Flex Option</label>
        <label class="ticket-meta ticket-addon-price">2,50 EUR &middot; pro Ticket</label>
      </div>
    </div>
  </div>
</body>
</html>
