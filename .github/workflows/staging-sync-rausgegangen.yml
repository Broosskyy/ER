name: Daily Rausgegangen New Events & Tickets

on:
  # Re-certify bounded NEW event upserts after merge of this workflow.
  # Normal app pushes do not retrigger; daily cron continues thereafter.
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-sync-rausgegangen.yml'
  schedule:
    - cron: '41 7 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eternal-rave-public-supabase-cli
  cancel-in-progress: false

jobs:
  verified-event-ingestion:
    runs-on: ubuntu-latest
    timeout-minutes: 100
    defaults:
      run:
        working-directory: app-v2
    env:
      ETERNAL_RAVE_ENABLE_DAILY_SYNC: 'true'
      ETERNAL_RAVE_PUBLIC_DB_SYNC_ACKNOWLEDGED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium for verified provider ticket pages
        run: npx playwright install --with-deps chromium
      - name: Check Supabase access token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Supabase access is missing; import disabled"
            exit 1
          fi
      - name: Link exact public-site database project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes
      - name: Verify source-refresh revision for post-fix recovery
        run: git rev-parse HEAD
      - name: Import up to eight verified new events (ticket-first, source fallback)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-scheduled-staging-sync.ts rausgegangen-discovery
      - name: Upload new-event candidates, source/ticket evidence, and diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-rausgegangen-source-audit
          path: app-v2/.tmp/m9-0-scheduled-sync/
          if-no-files-found: warn
          retention-days: 14
