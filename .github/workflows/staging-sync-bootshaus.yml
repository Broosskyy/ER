name: Staging Sync — Bootshaus

on:
  schedule:
    # Europe/Berlin CEST (UTC+2): 00:15, 06:15, 12:15, 18:15
    - cron: '15 22 * * *'
    - cron: '15 4 * * *'
    - cron: '15 10 * * *'
    - cron: '15 16 * * *'
  workflow_dispatch:

concurrency:
  group: staging-sync-bootshaus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Link staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes

      - name: Run scheduled Bootshaus sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-scheduled-staging-sync.ts bootshaus-official
