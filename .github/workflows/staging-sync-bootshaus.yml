name: Staging Sync — Bootshaus

on:
  # Single post-merge verification run for the controlled catch-up rollout.
  # Ordinary pushes to app code do not trigger this expensive public import.
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-sync-bootshaus.yml'
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eternal-rave-public-supabase-cli
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app-v2
    env:
      ETERNAL_RAVE_ENABLE_DAILY_SYNC: 'true'
      ETERNAL_RAVE_PUBLIC_DB_SYNC_ACKNOWLEDGED: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Fail closed if the Supabase access token is not configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN is missing; daily sync was not run."
            exit 1
          fi

      - name: Link staging Supabase project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes

      - name: Run controlled Bootshaus staging sync
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-scheduled-staging-sync.ts bootshaus-official

      - name: Upload daily Bootshaus audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-bootshaus-audit
          path: app-v2/.tmp/m9-0-scheduled-sync/
          if-no-files-found: ignore
          retention-days: 14
