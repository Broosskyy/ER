name: Daily Ticket.io Discovery and Price Audit (read-only)

on:
  schedule:
    - cron: '29 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ticketio-daily-discovery
  cancel-in-progress: false

jobs:
  ticketio-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    defaults:
      run:
        working-directory: app-v2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json
      - name: Install dependencies
        run: npm ci

      - name: Check access token without printing it
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::SUPABASE_ACCESS_TOKEN missing; read-only discovery cannot load the existing event catalog."
            exit 1
          fi
      - name: Link the fixed public-site-connected project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes

      - name: Ticket.io Germany source network discovery (no DB writes)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-m9-3b-1-ticketio-network-discovery.ts

      - name: Audit every future public event ticket (read-only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-daily-public-ticket-quality-audit.ts

      - name: Upload read-only evidence and match review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketio-daily-source-audit
          path: |
            artifacts/m9-3b-1-ticketio-network-discovery/
            artifacts/daily-public-ticket-quality/
          if-no-files-found: ignore
          retention-days: 14
