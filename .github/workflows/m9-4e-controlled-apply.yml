name: M9.4E Controlled Staging Apply

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - feature/m9-4e-controlled-apply

permissions:
  contents: read

concurrency:
  group: m9-4e-controlled-staging-apply
  cancel-in-progress: false

jobs:
  validate-contract:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/m9-4e-controlled-apply'
    name: Validate frozen 38-event apply contract
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app-v2
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate frozen apply contract
        run: npx tsx scripts/run-m9-4e-controlled-apply.ts --contract-only

  apply:
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/feature/m9-4e-controlled-apply' &&
      contains(github.event.head_commit.message, '[M9.4E APPLY 38]')
    name: Apply frozen 38-event cohort to Eternal Rave staging
    runs-on: ubuntu-latest
    timeout-minutes: 75
    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout exact authorized head
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Verify authorization boundary
        run: |
          test "$GITHUB_REF" = "refs/heads/feature/m9-4e-controlled-apply"
          echo "$GITHUB_SHA"
          echo "Authorized M9.4E controlled staging apply."

      - name: Verify Supabase CLI
        run: npx supabase --version

      - name: Link exact Eternal Rave staging project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes

      - name: Read-only preflight
        env:
          ETERNAL_RAVE_PRODUCTION_PROJECT_REF: ''
        run: npx tsx scripts/run-m9-4e-controlled-apply.ts

      - name: Controlled staging apply
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          ETERNAL_RAVE_PRODUCTION_PROJECT_REF: ''
          M94E_ALLOW_STAGING_APPLY: 'yes'
        run: >-
          npx tsx scripts/run-m9-4e-controlled-apply.ts
          --apply
          --confirm=M9.4E-CONTROLLED-APPLY-38

      - name: Print result
        if: always()
        run: |
          if [ -f ../artifacts/m9-4e-controlled-apply/apply-result.json ]; then
            cat ../artifacts/m9-4e-controlled-apply/apply-result.json
          elif [ -f ../artifacts/m9-4e-controlled-apply/prewrite.json ]; then
            cat ../artifacts/m9-4e-controlled-apply/prewrite.json
          else
            echo "No controlled-apply artifact generated."
          fi

      - name: Upload audit artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: m9-4e-controlled-staging-apply
          path: artifacts/m9-4e-controlled-apply
          if-no-files-found: warn
          retention-days: 30
