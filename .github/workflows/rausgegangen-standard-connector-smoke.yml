name: Rausgegangen Standard Connector Smoke

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rausgegangen-standard-connector-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'fix/automatic-event-completeness-contract'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: app-v2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app-v2/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run live read-only standard connector smoke
        run: npx tsx scripts/run-rausgegangen-standard-connector-smoke.ts

      - name: Print summary
        if: always()
        run: |
          if [ -f ../artifacts/rausgegangen-standard-connector-smoke/summary.json ]; then
            cat ../artifacts/rausgegangen-standard-connector-smoke/summary.json
          fi

      - name: Upload smoke artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rausgegangen-standard-connector-smoke
          path: artifacts/rausgegangen-standard-connector-smoke
          if-no-files-found: warn
          retention-days: 30
