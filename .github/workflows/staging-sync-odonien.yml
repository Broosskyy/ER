name: Daily Odonien Club Electronic Events and Tickets

on:
  # One guarded import when the source is certified and merged.
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-sync-odonien-club.yml'
  schedule:
    - cron: '27 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eternal-rave-public-supabase-cli
  cancel-in-progress: false

jobs:
  official-electronic-events:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    defaults:
      run:
        working-directory: app-v2
    env:
      ETERNAL_RAVE_ENABLE_DAILY_SYNC: 'true'
      ETERNAL_RAVE_PUBLIC_DB_SYNC_ACKNOWLEDGED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Confirm Supabase token is configured
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Supabase access is missing; source import disabled"
            exit 1
          fi
      - name: Link the exact public-serving project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes
      - name: Run guarded official electronic-only odonien-club import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-scheduled-staging-sync.ts odonien-club-official
      - name: Upload source and ticket audits
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-odonien-club-electronic-source-audit
          path: app-v2/.tmp/m9-0-scheduled-sync/
          if-no-files-found: warn
          retention-days: 14
