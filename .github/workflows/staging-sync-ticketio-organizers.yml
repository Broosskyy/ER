name: Seven Verified Ticket.io Electronic Organizer Sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/staging-sync-ticketio-organizers.yml'
  schedule:
    - cron: '53 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: eternal-rave-public-supabase-cli
  cancel-in-progress: false

jobs:
  electronic-events:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    defaults:
      run:
        working-directory: app-v2
    env:
      ETERNAL_RAVE_ENABLE_DAILY_SYNC: 'true'
      ETERNAL_RAVE_PUBLIC_DB_SYNC_ACKNOWLEDGED: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: app-v2/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Confirm Supabase token
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Supabase token missing"
            exit 1
          fi
      - name: Link exact public site project
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx supabase link --project-ref gnkjzinwvmrxcadwebhv --yes
      - name: Run identity-checked ticket.io shop event import
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npx tsx scripts/run-scheduled-staging-sync.ts ticketio-organizer-discovery
      - name: Upload source and ticket audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticketio-organizer-electronic-import-audit
          path: app-v2/.tmp/m9-0-scheduled-sync/
          if-no-files-found: warn
          retention-days: 14
