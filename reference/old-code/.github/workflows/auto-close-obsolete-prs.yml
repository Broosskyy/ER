name: Auto-close obsolete PRs

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  pull-requests: write
  issues: write

jobs:
  close-obsolete:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            // Branches superseded by merged sprints — extend this list as needed.
            const OBSOLETE_BRANCHES = [
              'cursor/eternal-rave-mvp-a932',
            ];

            const { data: prs } = await github.rest.pulls.list({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              per_page: 100,
            });

            for (const pr of prs) {
              const head = pr.head.ref;
              let shouldClose = OBSOLETE_BRANCHES.includes(head);

              // Auto-close conflicting cursor/* PRs (obsolete parallel agent runs)
              if (!shouldClose && head.startsWith('cursor/')) {
                const detail = await github.rest.pulls.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  pull_number: pr.number,
                });
                if (detail.data.mergeable === false) {
                  shouldClose = true;
                }
              }

              if (!shouldClose) continue;

              await github.rest.pulls.update({
                owner: context.repo.owner,
                repo: context.repo.repo,
                pull_number: pr.number,
                state: 'closed',
              });

              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body:
                  'Automatisch geschlossen: Branch ist obsolet oder hat Konflikte mit `main`. ' +
                  'Aktueller Stand liegt auf `main` (Sprint 3 #37, Sprint 4 #38).',
              });

              core.info(`Closed PR #${pr.number} (${head})`);
            }
